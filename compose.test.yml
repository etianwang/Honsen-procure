services:
  postgres-test:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: honsen_test
      POSTGRES_USER: honsen_test
      POSTGRES_PASSWORD: honsen_test
    ports:
      - '54329:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U honsen_test -d honsen_test']
      interval: 5s
      timeout: 5s
      retries: 10
