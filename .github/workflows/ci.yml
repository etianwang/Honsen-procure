name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: honsen_test
          POSTGRES_USER: honsen_test
          POSTGRES_PASSWORD: ${{ github.run_id }}
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U honsen_test -d honsen_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://honsen_test:${{ github.run_id }}@localhost:5432/honsen_test
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build
      - run: node --test tests/release/*.test.mjs
      - name: Verify T04 database deployment grants
        run: TMPDIR="$RUNNER_TEMP" node tests/deploy/test-t04-grants.cjs
      - name: Verify Linux nginx and systemd ingress integration
        run: |
          sudo apt-get update
          sudo apt-get install -y nginx sshfs openssh-server postgresql-client rsync
          sudo env HONSEN_DEPLOY_TEST=1 TEST_WORK_DIR="$RUNNER_TEMP" bash tests/deploy/test-real-nginx.sh
          sudo env HONSEN_DEPLOY_TEST=1 TEST_NODE_DIR="$(dirname "$(command -v node)")" bash tests/deploy/test-real-systemd.sh
          sudo install -d -m 700 /var/lib/honsen-artifact-test
          sudo env TMPDIR=/var/lib/honsen-artifact-test "$(command -v node)" tests/deploy/test-artifact.cjs
          sudo env TMPDIR=/var/lib/honsen-artifact-test "$(command -v node)" tests/deploy/test-writer-inventory.cjs
          sudo env HONSEN_DEPLOY_TEST=1 TEST_TMP=/var/lib/honsen-artifact-test bash tests/deploy/test-completed.sh
          sudo env HONSEN_DEPLOY_TEST=1 TEST_TMP=/var/lib/honsen-artifact-test bash tests/deploy/test-controller-authorization.sh
          sudo env TMPDIR=/var/lib/honsen-artifact-test bash tests/deploy/test-api-grant-policy.sh
          sudo env HONSEN_DEPLOY_TEST=disposable-ci TEST_NODE_DIR="$(dirname "$(command -v node)")" TEST_PG_PASSWORD="${{ github.run_id }}" TEST_REPO="$GITHUB_WORKSPACE" bash tests/deploy/test-controller-e2e.sh
      - name: Build traceable Linux candidate
        run: |
          sudo install -d -m 755 /var/lib/honsen-rc-build
          sudo env PATH="$PATH" GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0=safe.directory GIT_CONFIG_VALUE_0="$GITHUB_WORKSPACE" npm_config_cache="$RUNNER_TEMP/honsen-rc-npm" RELEASE_DIR=/var/lib/honsen-rc-build/candidate bash deploy/linux/scripts/build-release.sh
          sudo chmod 644 /var/lib/honsen-rc-build/candidate.manifest.json
      - name: Preserve Linux candidate artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-candidate-${{ github.sha }}
          path: |
            /var/lib/honsen-rc-build/candidate.tar.gz
            /var/lib/honsen-rc-build/candidate.tar.gz.sha256
            /var/lib/honsen-rc-build/candidate.manifest.json
          if-no-files-found: error
          retention-days: 7
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7
