name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: honsen_test
          POSTGRES_USER: honsen_test
          POSTGRES_PASSWORD: ${{ github.run_id }}
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U honsen_test -d honsen_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://honsen_test:${{ github.run_id }}@localhost:5432/honsen_test
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build
      - name: Verify Linux nginx and systemd ingress integration
        run: |
          sudo apt-get update
          sudo apt-get install -y nginx sshfs openssh-server postgresql-client rsync
          sudo env HONSEN_DEPLOY_TEST=1 TEST_WORK_DIR="$RUNNER_TEMP" bash tests/deploy/test-real-nginx.sh
          sudo env HONSEN_DEPLOY_TEST=1 TEST_NODE_DIR="$(dirname "$(command -v node)")" bash tests/deploy/test-real-systemd.sh
          sudo install -d -m 700 /var/lib/honsen-artifact-test
          sudo env TMPDIR=/var/lib/honsen-artifact-test "$(command -v node)" tests/deploy/test-artifact.cjs
          sudo env TMPDIR=/var/lib/honsen-artifact-test "$(command -v node)" tests/deploy/test-writer-inventory.cjs
          sudo env HONSEN_DEPLOY_TEST=1 TEST_TMP=/var/lib/honsen-artifact-test bash tests/deploy/test-completed.sh
          sudo env HONSEN_DEPLOY_TEST=1 TEST_TMP=/var/lib/honsen-artifact-test bash tests/deploy/test-controller-authorization.sh
          sudo env HONSEN_DEPLOY_TEST=disposable-ci TEST_NODE_DIR="$(dirname "$(command -v node)")" TEST_PG_PASSWORD="${{ github.run_id }}" TEST_REPO="$GITHUB_WORKSPACE" bash tests/deploy/test-controller-e2e.sh
          psql "$TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -c 'CREATE DATABASE qa_deployment_lock'
          env HONSEN_DEPLOY_TEST=1 PGHOST=127.0.0.1 PGPORT=5432 PGUSER=honsen_test PGPASSWORD='${{ github.run_id }}' PGDATABASE=qa_deployment_lock bash tests/deploy/test-deployment-lock.sh
          psql "$TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -c 'DROP DATABASE qa_deployment_lock'
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7
