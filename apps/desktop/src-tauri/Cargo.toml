[package]
name = "honsen-materials-desktop-core"
version = "0.0.0-development"
edition = "2024"
publish = false
build = "build.rs"
default-run = "HonsenProcure"

[[bin]]
name = "HonsenProcure"
path = "src/main.rs"

[[bin]]
name = "honsen-procure-test-profile"
path = "src/bin/test_profile.rs"

[[bin]]
name = "honsen-procure-bootstrap-admin"
path = "src/bin/bootstrap_admin.rs"

[[bin]]
name = "honsen-procure-seed"
path = "src/bin/seed.rs"

[lib]
name = "honsen_materials_desktop_core"
path = "src/lib.rs"

[dependencies]
argon2 = "0.5.3"
base64 = "0.22.1"
keyring = "3.6.3"
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png"] }
rand_core = { version = "0.6.4", features = ["getrandom"] }
rpassword = "7.4.0"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "query", "rustls"] }
rusqlite = { version = "0.37.0", features = ["bundled"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
sha2 = "0.10.9"
tauri = { version = "2.10.2", default-features = false, features = ["wry"] }
thiserror = "2.0.17"
uuid = { version = "1.18.1", features = ["serde", "v4"] }

[build-dependencies]
tauri-build = { version = "2.7.1", features = [] }
