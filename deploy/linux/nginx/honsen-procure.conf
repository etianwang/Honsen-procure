# Merge into a Baota-managed HTTPS site; replace domain and TLS paths.
# Never set root/alias to /www/Honsen-procure or expose config/backups.
server {
    listen 80;
    server_name api.example.invalid;
    return 308 https://$host$request_uri;
}
server {
    listen 443 ssl;
    server_name api.example.invalid;
    ssl_certificate /www/server/panel/vhost/cert/api.example.invalid/fullchain.pem;
    ssl_certificate_key /www/server/panel/vhost/cert/api.example.invalid/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    access_log off;
    client_max_body_size 200m;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 60s;
    }
}
