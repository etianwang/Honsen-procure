# Replace domain and certificate paths using Baota, then run nginx -t.
server {
    listen 80;
    server_name REPLACE_WITH_DOMAIN;
    return 301 https://$host$request_uri;
}
server {
    listen 443 ssl;
    server_name REPLACE_WITH_DOMAIN;
    ssl_certificate /REPLACE_WITH_BAOTA_CERTIFICATE/fullchain.pem;
    ssl_certificate_key /REPLACE_WITH_BAOTA_CERTIFICATE/privkey.pem;
    client_max_body_size 200m;
    # Do not log signed queries or authorization headers.
    access_log off;
    location / {
        include /etc/honsen-procure/nginx-ingress.conf;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 60s;
    }
}
